<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube 自動二重字幕プレイヤー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #121212;
      color: #fff;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .input-group {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }
    input {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      background: #ff0000;
      color: #fff;
      border: none;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    #player {
      width: 100%;
      height: 100%;
    }
    .status-bar {
      font-size: 0.85rem;
      color: #00ffcc;
      background: #1a1a1a;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 15px;
      word-break: break-all;
    }
    .subtitles {
      padding: 15px;
      background: #1e1e1e;
      border-radius: 8px;
      text-align: center;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .en { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
    .ja { font-size: 1rem; color: #ffeb3b; }
  </style>
</head>
<body>

  <div class="container">
    <h2>YouTube 自動二重字幕プレイヤー</h2>
    
    <div class="input-group">
      <input type="text" id="urlInput" placeholder="例: https://youtu.be/xxxx または ID" value="M7lc1UVf-VE">
      <button onclick="changeVideo()">読み込み・再生</button>
    </div>

    <div class="status-bar" id="statusBar">ステータス: 待機中</div>

    <div class="video-wrapper">
      <div id="player"></div>
    </div>

    <div class="subtitles">
      <div class="en" id="enSub">URLを入力して読み込んでください</div>
      <div class="ja" id="jaSub">Subtitles will appear automatically</div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player;
    let timeCheckInterval;
    let currentSubtitles = [];

    function setStatus(msg) {
      const el = document.getElementById('statusBar');
      if (el) el.textContent = "ステータス: " + msg;
    }

    window.onYouTubeIframeAPIReady = function() {
      setStatus("プレイヤーを初期化中...");
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'M7lc1UVf-VE',
        events: {
          'onReady': () => {
            setStatus("プレイヤー準備完了。字幕を取得します...");
            fetchAndLoadSubtitles('M7lc1UVf-VE');
          },
          'onStateChange': onPlayerStateChange
        }
      });
    };

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (timeCheckInterval) clearInterval(timeCheckInterval);
        
        timeCheckInterval = setInterval(() => {
          if (player && typeof player.getCurrentTime === 'function') {
            const currentTime = player.getCurrentTime();
            updateSubtitles(currentTime);
          }
        }, 200);
      } else {
        if (timeCheckInterval) clearInterval(timeCheckInterval);
      }
    }

    function updateSubtitles(currentTime) {
      const enSubEl = document.getElementById('enSub');
      const jaSubEl = document.getElementById('jaSub');

      if (!currentSubtitles || currentSubtitles.length === 0) {
        enSubEl.textContent = `再生中 (${Math.floor(currentTime)}秒)`;
        jaSubEl.textContent = "";
        return;
      }

      const sub = currentSubtitles.find(s => currentTime >= s.start && currentTime <= s.end);

      if (sub) {
        enSubEl.textContent = sub.en;
        jaSubEl.textContent = sub.ja || "";
      } else {
        enSubEl.textContent = "";
        jaSubEl.textContent = "";
      }
    }

    async function fetchAndLoadSubtitles(videoId) {
      setStatus("字幕を自動取得中...");
      try {
        const targetUrl = `https://www.youtube.com/api/timedtext?v=${videoId}&lang=en`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        
        const response = await fetch(proxyUrl);
        if (!response.ok) {
          throw new Error("プロキシ通信エラー");
        }

        const data = await response.json();
        if (!data.contents) {
          throw new Error("字幕データが見つかりません");
        }

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(data.contents, "text/xml");
        const textElements = xmlDoc.getElementsByTagName("text");
        
        if (textElements.length === 0) {
          throw new Error("利用可能な字幕がありません");
        }

        const formatted = [];
        for (let i = 0; i < textElements.length; i++) {
          const el = textElements[i];
          const start = parseFloat(el.getAttribute("start") || 0);
          const dur = parseFloat(el.getAttribute("dur") || 3);
          const text = el.textContent
            .replace(/&#39;/g, "'")
            .replace(/&quot;/g, '"')
            .replace(/&amp;/g, '&');

          formatted.push({
            start: start,
            end: start + dur,
            en: text,
            ja: ""
          });
        }

        currentSubtitles = formatted;
        setStatus("字幕の自動取得に成功しました！再生できます。");
      } catch (e) {
        setStatus("取得エラー: " + e.message + "（サンプルデータを使用します）");
        currentSubtitles = [
          { start: 0, end: 5, en: "Fallback subtitle test.", ja: "フォールバック字幕テストです。" },
          { start: 5, end: 10, en: "Enjoy your study!", ja: "学習をお楽しみください！" }
        ];
      }
    }

    window.changeVideo = function() {
      const input = document.getElementById('urlInput').value.trim();
      let videoId = "";

      if (!input) {
        alert("URLを入力してください。");
        return;
      }

      if (input.includes('youtu.be/')) {
        videoId = input.split('youtu.be/')[1].split('?')[0];
      } else if (input.includes('watch?v=')) {
        videoId = input.split('watch?v=').pop().split('&')[0];
      } else if (input.includes('embed/')) {
        videoId = input.split('embed/')[1].split('?')[0];
      } else {
        videoId = input;
      }

      if (videoId && videoId.length >= 10) {
        if (player && typeof player.loadVideoById === 'function') {
          player.loadVideoById(videoId);
          fetchAndLoadSubtitles(videoId);
        }
      } else {
        alert("正しいYouTubeのURLまたは動画IDを入力してください。");
      }
    };
  </script>
</body>
</html>
